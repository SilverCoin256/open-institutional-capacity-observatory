[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oico"
version = "1.0.0rc1"
description = "Open Institutional Capacity Observatory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shaurya Gupta"}]
keywords = ["computational social science", "AI governance", "public administration", "reproducibility"]
dependencies = []

[project.scripts]
oico = "oico.cli.main:main"

[tool.setuptools.packages.find]
include = ["oico*"]

