[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oico"
version = "1.1.1"
description = "Open research software for measuring observable administrative congestion and oversight constraints from public data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Shaurya Gupta"}]
keywords = ["computational social science", "AI governance", "public administration", "institutional capacity", "reproducibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://silvercoin256.github.io/open-institutional-capacity-observatory/"
Repository = "https://github.com/SilverCoin256/open-institutional-capacity-observatory"
Documentation = "https://silvercoin256.github.io/open-institutional-capacity-observatory/"
Issues = "https://github.com/SilverCoin256/open-institutional-capacity-observatory/issues"
Changelog = "https://github.com/SilverCoin256/open-institutional-capacity-observatory/blob/main/CHANGELOG.md"

[project.scripts]
oico = "oico.cli.main:main"

[tool.setuptools.packages.find]
include = ["oico*", "research*"]

[tool.coverage.run]
branch = true
source = ["oico"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
