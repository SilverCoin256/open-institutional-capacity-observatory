name: oico-ci

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Reproduce release candidate
        run: python -m oico.cli.main reproduce
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Execute notebooks
        run: python scripts/execute_notebooks.py
      - name: Scan for credentials
        run: python scripts/scan_secrets.py
      - name: Check release
        run: python scripts/check_release.py
